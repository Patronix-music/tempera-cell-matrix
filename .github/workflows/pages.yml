name: Deploy Pages (stable + beta)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pages site folder (stable at /, beta at /beta/)
        run: |
          rm -rf site
          mkdir -p site/beta

          # Copy main to site root
          cp -R . site/

          # Ensure beta entrypoint is present
          cp beta/index.html site/beta/index.html

          # Avoid Jekyll processing
          touch site/.nojekyll

          # Never deploy workflow/git metadata
          rm -rf site/.github
          rm -rf site/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
