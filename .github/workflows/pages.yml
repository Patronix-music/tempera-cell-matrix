name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site folder
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html

          cp favicon-v2.ico site/
          cp favicon-16x16-v2.png site/
          cp favicon-32x32-v2.png site/
          cp apple-touch-icon-v2.png site/
          cp android-chrome-192x192-v2.png site/
          cp android-chrome-512x512-v2.png site/
          cp site-v2.webmanifest site/

          # Optional fallback for stubborn browsers/bookmarks
          cp favicon.ico site/ || true
          cp favicon-16x16.png site/ || true
          cp favicon-32x32.png site/ || true
          cp apple-touch-icon.png site/ || true

          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
