name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site folder
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html

          cp favicon-v3-multisize.ico site/
          cp favicon-16x16-v3.png site/
          cp favicon-32x32-v3.png site/
          cp favicon-48x48-v3.png site/
          cp favicon-64x64-v3.png site/
          cp apple-touch-icon-v3.png site/
          cp apple-touch-icon-120x120-v3.png site/
          cp apple-touch-icon-152x152-v3.png site/
          cp android-chrome-192x192-v3.png site/
          cp android-chrome-512x512-v3.png site/
          cp safari-pinned-tab.svg site/
          cp site-v3.webmanifest site/

          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
